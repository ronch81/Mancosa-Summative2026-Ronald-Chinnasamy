<!DOCTYPE html>
<!--
    Sunrise Community Clinic
    patients.html - search for patients and register or update them.
    By Ronald Chinnasamy

    Requirements:
    Requires css/style.css for the look
    Requires js/patients.js for the search and the form.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Sunrise Community Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <span class="clinic-name">Sunrise Community Clinic</span>
        <span class="user-info">
            Logged in as: <span id="user-role"></span> |
            <a href="#" id="logout-link">Log Out</a>
        </span>
    </header>

    <!-- Menu tabs -->
    <nav class="menu">
        <a href="patients.html" class="active">Patients</a>
        <a href="appointments.html">Appointments</a>
        <a href="reports.html">Reports</a>
        <a href="admin.html" id="admin-tab">Administration</a>
        <a href="visits.html" id="visits-tab">Visits</a>
    </nav>

    <!-- Patient Search Functionality -->
    <section class="page">
        <h2>Find Patient</h2>

        <label for="search-box">Patient (name or ID number)</label>
        <input type="text" id="search-box" placeholder="Search patient">
        <button type="button" id="search-button" class="button-orange">Search</button>

        <p id="search-message" class="error-text"></p>

        <table id="results-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>ID Number</th>
                    <th>Address</th>
                    <th>Contact Number</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="results-body"></tbody>
        </table>
    </section>

    <!-- Patient Registration Form -->
    <section class="page" id="patient-form-section">
        <h2 id="form-title">Register New Patient</h2>

        <form id="patient-form">
            <div class="form-columns">
                <div>
                    <label for="first-name">First Name *</label>
                    <input type="text" id="first-name" placeholder="Enter first name">

                    <label for="surname">Surname *</label>
                    <input type="text" id="surname" placeholder="Enter surname">

                    <label for="id-number">ID Number *</label>
                    <input type="text" id="id-number" placeholder="Enter ID number">
                </div>
                <div>
                    <label for="address">Address *</label>
                    <input type="text" id="address" placeholder="Enter street address">

                    <label for="contact-number">Contact Number *</label>
                    <input type="text" id="contact-number" placeholder="Enter contact number">
                </div>
            </div>

            <button type="submit" id="save-button" class="button-orange">Save Patient</button>
            <button type="button" id="clear-button" class="button-grey">Clear Form</button>
        </form>

        <p id="form-message" class="error-text"></p>
        <p class="small-note">* Required fields. The ID number must be unique.</p>
    </section>

    <script src="js/common.js"></script>
    <script src="js/patients.js"></script>
</body>
</html>
